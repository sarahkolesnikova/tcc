[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio-residuos"
version = "0.1.0"
description = "Pipeline e dashboard de resíduos sólidos e REEE com dados abertos do Ibama, SINIR e IBGE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "duckdb>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]
orquestracao = ["apache-airflow>=2.9"]

[project.scripts]
residuos = "residuos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
